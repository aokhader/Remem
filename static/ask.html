<!doctype html>
<!-- Ask page (R6, R9). Owner: Varick. Served at GET /ask; opened in Safari on the ask iPhone.
     States: idle → searching → act | ask | none | error (context/ui.md).
     Dev: /ask?fixture=act|ask|none|recall|error|timeline renders a canned Answer, no server call. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f1ea">
  <title>Remem — Ask</title>
  <link rel="stylesheet" href="/static/card.css">
  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #14171a;
      --muted: #5b6066;
      --line: #d9d4c8;
      --accent: #1b7f3b;
      --field: #ffffff;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .brand { display: flex; align-items: baseline; gap: 0.5rem; margin: 0.5rem 0 1rem; }
    .brand h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
    .brand p { margin: 0; color: var(--muted); font-size: 0.95rem; }

    form { display: flex; gap: 0.5rem; }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.85rem 1rem;
      border: 2px solid var(--line);
      border-radius: 0.9rem;
      background: var(--field);
      color: var(--ink);
      font: inherit;
      font-size: 1.15rem; /* ≥ 16px so iOS doesn't zoom on focus */
    }
    input:focus { outline: none; border-color: var(--ink); }
    button {
      padding: 0 1.3rem;
      border: 0;
      border-radius: 0.9rem;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .hint { margin: 0.6rem 0.2rem 0; color: var(--muted); font-size: 0.95rem; }
    .status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-height: 1.6rem;
      margin: 1rem 0.2rem 0.6rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .spinner {
      display: none;
      width: 1.1rem;
      height: 1.1rem;
      border: 3px solid var(--line);
      border-top-color: var(--ink);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    body[data-state="searching"] .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

    #result { font-size: 1rem; }
    body[data-state="searching"] #result { opacity: 0.35; }
    .retry { width: 100%; margin-top: 0.8rem; padding: 0.9rem; background: var(--field); color: var(--ink); border: 2px solid var(--ink); }

    .examples { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.2rem 0 0; padding: 0; list-style: none; }
    .examples button {
      padding: 0.55rem 0.9rem;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      background: var(--field);
      color: var(--ink);
      font-weight: 500;
      font-size: 0.95rem;
    }
    body:not([data-state="idle"]) .examples-wrap { display: none; }

    .dev-banner {
      margin: 0 0 0.8rem;
      padding: 0.4rem 0.7rem;
      border-radius: 0.5rem;
      background: #fff3cd;
      color: #5c4400;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body data-state="idle">
  <main>
    <div class="brand">
      <h1>Remem</h1>
      <p>Ask where you left something.</p>
    </div>

    <form id="ask-form" autocomplete="off">
      <label for="q" class="visually-hidden">Your question</label>
      <input id="q" name="q" type="text" enterkeyhint="search" placeholder="Where are my keys?"
             autocapitalize="sentences" spellcheck="false">
      <button id="ask-btn" type="submit">Ask</button>
    </form>
    <p class="hint">Tap 🎤 on the keyboard to dictate.</p>

    <div class="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="status-text"></span></div>

    <div class="examples-wrap">
      <ul class="examples" aria-label="Example questions">
        <li><button type="button">Where are my keys?</button></li>
        <li><button type="button">Where is my passport?</button></li>
        <li><button type="button">When was I at the whiteboard?</button></li>
      </ul>
    </div>

    <section id="result" aria-live="polite"></section>
  </main>

  <script type="module">
    import { renderCard } from "/static/card.js";

    const TIMEOUT_MS = 8000; // context/ui.md → ask page searching state

    const form = document.getElementById("ask-form");
    const input = document.getElementById("q");
    const button = document.getElementById("ask-btn");
    const statusText = document.getElementById("status-text");
    const result = document.getElementById("result");

    let inflight = null;
    let lastQuestion = "";

    function setState(state, text = "") {
      document.body.dataset.state = state;
      statusText.textContent = text;
      button.disabled = state === "searching";
    }

    function clientError(q, error, message) {
      return {
        q, kind: "find", object: "", band: "error", message, hit: null, frame_url: null, ago_s: null,
        spot: null, sightings: [], moments: [], asked_ts: Date.now() / 1000, timings_ms: {}, error,
      };
    }

    function show(answer, elapsedMs) {
      renderCard(result, answer);
      if (answer.band === "error") {
        const retry = document.createElement("button");
        retry.className = "retry";
        retry.type = "button";
        retry.textContent = "Try again";
        retry.addEventListener("click", () => ask(lastQuestion || input.value.trim()));
        result.append(retry);
      }
      setState(answer.band, elapsedMs == null ? "" : `Answered in ${(elapsedMs / 1000).toFixed(1)} s`);
      result.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function ask(q) {
      if (!q) { input.focus(); return; }
      lastQuestion = q;
      inflight?.abort();
      const ctrl = new AbortController();
      inflight = ctrl;
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      setState("searching", `Looking: “${q}”`);
      const started = performance.now();
      try {
        const res = await fetch(`/ask?q=${encodeURIComponent(q)}`, { signal: ctrl.signal, cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const answer = await res.json();
        if (ctrl === inflight) show(answer, performance.now() - started);
      } catch (err) {
        if (ctrl !== inflight) return; // superseded by a newer question
        show(err.name === "AbortError"
          ? clientError(q, "timeout", "That took too long. Try again.")
          : clientError(q, String(err.message || err), "Can't reach Remem. Check Wi-Fi and try again."));
      } finally {
        clearTimeout(timer);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const q = input.value.trim();
      input.blur(); // drop the iOS keyboard so the card is visible
      ask(q);
    });

    document.querySelectorAll(".examples button").forEach((b) =>
      b.addEventListener("click", () => { input.value = b.textContent; ask(b.textContent); }));

    const fixture = new URLSearchParams(location.search).get("fixture");
    if (fixture) {
      const { FIXTURES } = await import("/static/dev-fixtures.js");
      const answer = FIXTURES[fixture];
      const banner = document.createElement("p");
      banner.className = "dev-banner";
      banner.textContent = answer ? `DEV FIXTURE: ${fixture} (no server call)` : `Unknown fixture "${fixture}"`;
      document.querySelector("main").prepend(banner);
      if (answer) { input.value = answer.q; show(answer); }
    }
  </script>
</body>
</html>
